name: Sector Sign - Source import and MySQL QA
on:
  push:
    branches: [main]
    paths: ['.bootstrap/**', '.github/workflows/import-sources.yml', 'server/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: qa-only-test
          MYSQL_DATABASE: sector_sign_qa
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pqa-only-test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Import verified source archive when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .bootstrap ]; then
            python3 - <<'PY'
          import pathlib,hashlib,lzma,tarfile,io
          parts=sorted(pathlib.Path('.bootstrap').glob('source*.part'))
          assert len(parts)==18, 'Incomplete import'
          data=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=='bd62bd1e92b21b658598ac221c0c253817bfcdd107e2a7bf3bd4a5eb449a74b8'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(data))) as tf:
            for m in tf.getmembers():
              p=pathlib.PurePosixPath(m.name)
              assert m.isfile() and not p.is_absolute() and '..' not in p.parts
              assert '.github' not in p.parts and '.git' not in p.parts
              assert p.name not in {'config.php','install.key','.env'}
              assert p.suffix not in {'.jks','.keystore'}
            tf.extractall('.',filter='data')
          print('Source checksum and path safety verified')
          PY
            git rm -r .bootstrap
            git add server android-unificado angular-unificado integracion-inventario-pro-360 documentacion scripts README.md LEEME-PRIMERO.md .gitignore
            git add -u
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git diff --cached --quiet; then
              git commit -m 'Import Sector Sign 0.7.0: connected devices and multi-playlist scheduling'
              git push origin HEAD:main
            fi
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, sodium, curl, zip
          coverage: none
      - name: Static and schedule tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results
          sh server/tests/qa.sh | tee qa-results/static.txt
          python3 scripts/verificar-versiones.py | tee qa-results/versions.txt
      - name: Real MySQL and HTTP integration
        shell: bash
        env:
          SECTOR_SIGN_QA: '1'
        run: |
          set -euo pipefail
          php server/tests/ci-setup.php | tee qa-results/setup.txt
          php server/tests/mysql-smoke.php --run | tee qa-results/mysql.txt
          php server/tools/upgrade.php --apply | tee qa-results/upgrade.txt
          php server/tools/upgrade.php --apply | tee -a qa-results/upgrade.txt
          php -S 127.0.0.1:8787 -t server/public > qa-results/http-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/player.php >/dev/null && break; sleep 1; done
          python3 server/tests/program-http.py | tee qa-results/http.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SectorSign-QA-0.7.0
          path: qa-results/
          retention-days: 30
          if-no-files-found: warn
