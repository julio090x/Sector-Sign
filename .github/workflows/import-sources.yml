name: Sector Sign - Import 0.8 and MySQL QA
on:
  push:
    branches: [main]
    paths: ['.import/**', '.github/workflows/import-sources.yml', 'server/**', 'integracion-inventario-pro-360/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: qa-only-test
          MYSQL_DATABASE: sector_sign_qa
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pqa-only-test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Import verified source 0.8.0
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .import/SectorSign-Fuentes-Completas-0.8.0.zip ]; then
            python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib
          archive=Path('.import/SectorSign-Fuentes-Completas-0.8.0.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='4a328858e9e800633f5a38d7020c24987ba68521a051a90ec4b0fcf9972d30b5', 'Wrong ZIP checksum'
          allowed={'server','angular-unificado','android-unificado','integracion-inventario-pro-360','documentacion','scripts'}
          names={'README.md','LEEME-PRIMERO.md','.gitignore'}
          with ZipFile(archive) as z:
            assert z.testzip() is None
            for entry in z.infolist():
              path=PurePosixPath(entry.filename)
              assert entry.file_size<4*1024*1024 and not entry.is_dir()
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in allowed or entry.filename in names
              assert not any(p in path.parts for p in {'.git','.github','node_modules','storage','build'})
              assert path.name not in {'config.php','install.key','.env'} and path.suffix not in {'.jks','.keystore','.apk'}
              dest=Path(entry.filename);dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(z.read(entry))
          print('Verified and extracted Sector Sign 0.8.0 sources')
          PY
            git rm -r .import
            git add -A
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import Sector Sign 0.8.0: videowalls, media, groups and HMAC catalog'
            git push origin HEAD:main
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, sodium, curl, zip
          coverage: none
      - name: Static and contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results
          sh server/tests/qa.sh | tee qa-results/static.txt
          php integracion-inventario-pro-360/tests/contract.php | tee qa-results/inventory.txt
          python3 scripts/verificar-versiones.py | tee qa-results/versions.txt
      - name: MySQL 8.4 and HTTP integration
        shell: bash
        env:
          SECTOR_SIGN_QA: '1'
        run: |
          set -euo pipefail
          php server/tests/ci-setup.php | tee qa-results/setup.txt
          php server/tests/mysql-smoke.php --run | tee qa-results/mysql.txt
          php server/tools/upgrade.php --apply | tee qa-results/upgrade.txt
          php server/tools/upgrade.php --apply | tee -a qa-results/upgrade.txt
          php -S 127.0.0.1:8787 -t server/public > qa-results/http-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/player.php >/dev/null && break; sleep 1; done
          python3 server/tests/program-http.py | tee qa-results/http.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SectorSign-QA-0.8.0
          path: qa-results/
          retention-days: 30
          if-no-files-found: warn
