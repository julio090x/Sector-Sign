plugins { id 'com.android.application' }
android {
    namespace 'com.sectorsign.apps'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sectorsign.apps'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
        buildConfigField 'String', 'RELEASED_AT', '"2026-10-24T12:03:36Z"'
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'purpose'
    productFlavors {
        centro {
            dimension 'purpose'
            applicationId 'com.sectorsign.centro'
            resValue 'string', 'app_name', 'Sector Sign Mando'
            buildConfigField 'boolean', 'IS_PLAYER', 'false'
            buildConfigField 'String', 'ENTRY_PATH', '"/index.php"'
        }
        receptor {
            dimension 'purpose'
            applicationId 'com.sectorsign.receptor'
            resValue 'string', 'app_name', 'Sector Sign Reproductor'
            buildConfigField 'boolean', 'IS_PLAYER', 'true'
            buildConfigField 'String', 'ENTRY_PATH', '"/player.php"'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Sign outside GitHub with an owner-controlled private keystore.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
